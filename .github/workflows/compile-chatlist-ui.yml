name: Compile unread-count changes

on:
  push:
    branches:
      - feature/unread-all-tab-badge
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-chatlist-ui:
    name: Compile ChatListUI on macOS
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 27.2
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="/Applications/Xcode_27.2.app/Contents/Developer"
          test -d "$xcode_path"
          sudo xcode-select --switch "$xcode_path"
          xcode-select -p

      - name: Check Xcode and iOS Simulator SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -version | grep -F "Xcode 27.2"
          python3 --version
          simulator_sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "iOS Simulator SDK: $simulator_sdk_path"
          [[ "$simulator_sdk_path" == *iPhoneSimulator27.2.sdk ]]
          test -d "$simulator_sdk_path/System/Library/Frameworks/UIKit.framework"

      - name: Compile ChatListUI for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 build-system/Make/Make.py \
            --bazelArguments="--apple_platform_type=ios --cpu=ios_sim_arm64 --platforms=@build_bazel_apple_support//platforms:ios_sim_arm64" \
            build \
            --buildNumber=10000 \
            --configuration=debug_sim_arm64 \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --xcodeManagedCodesigning \
            --target=//submodules/ChatListUI:ChatListUI
